title: 'Fullscreen Video'
fields:
  -
    handle: video_portrait
    field:
      mode: list
      container: assets
      restrict: false
      allow_uploads: true
      show_filename: true
      show_set_alt: true
      type: assets
      display: 'Video (Portrait)'
      icon: assets
      instructions: 'Add a video in portrait mode for mobile devices. Format needs to be MP4'
      localizable: false
      listable: hidden
      instructions_position: below
      visibility: visible
      replicator_preview: true
      hide_display: false
      folder: video
      width: 50
      max_files: 1
      validate:
        - required
  -
    handle: video_landscape
    field:
      mode: list
      container: assets
      restrict: false
      allow_uploads: true
      show_filename: true
      show_set_alt: true
      type: assets
      display: 'Video (Landscape)'
      icon: assets
      instructions: 'Add a video in landscape mode for tablets and desktop. Format needs to be MP4'
      localizable: false
      listable: hidden
      instructions_position: below
      visibility: visible
      replicator_preview: true
      hide_display: false
      folder: video
      width: 50
      max_files: 1
      validate:
        - required
  -
    handle: video_poster_portrait
    field:
      mode: list
      container: assets
      restrict: false
      allow_uploads: true
      show_filename: true
      show_set_alt: true
      type: assets
      display: 'Video Poster (Portrait)'
      icon: assets
      instructions: 'Optional portrait poster for mobile devices and reduced-motion users.'
      localizable: false
      listable: hidden
      instructions_position: below
      visibility: visible
      replicator_preview: true
      hide_display: false
      folder: video
      width: 50
      max_files: 1
  -
    handle: video_poster_landscape
    field:
      mode: list
      container: assets
      restrict: false
      allow_uploads: true
      show_filename: true
      show_set_alt: true
      type: assets
      display: 'Video Poster (Landscape)'
      icon: assets
      instructions: 'Optional landscape poster shown while the video loads and to reduced-motion users.'
      localizable: false
      listable: hidden
      instructions_position: below
      visibility: visible
      replicator_preview: true
      hide_display: false
      folder: video
      width: 50
      max_files: 1
  -
    import: overlay
