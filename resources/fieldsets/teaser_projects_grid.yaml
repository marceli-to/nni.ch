title: 'Portfolio (Grid)'
fields:
  -
    import: title
    prefix: projects_grid_
  -
    handle: main_link
    field:
      type: link
      display: 'Main link'
      instructions: 'Link below the title. If empty, a link to the portfolio is generated.'
      localizable: true
      collections:
        - pages
        - projects
        - posts
  -
    handle: main_link_title
    field:
      type: text
      display: 'Main link label'
      instructions: 'Optional label for the main link. If empty, "Projekt anfragen" (translated) is used.'
      localizable: true
  -
    handle: projects
    field:
      type: entries
      collections:
        - projects
      display: Projects
      instructions: 'The projects shown in the grid, in this order. The pattern runs in cycles of eight: seven projects fill the first one exactly, because the title sits where the eighth would be, and the next seven or eight repeat it. Any number works — 7 and 15 end on a full row.'
      localizable: false
      validate:
        - required
  -
    import: cta_section_header
  -
    import: cta_text
  -
    import: cta
