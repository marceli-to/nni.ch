title: 'Portfolio (Grid)'
fields:
  -
    import: title
    prefix: projects_grid_
  -
    handle: main_link
    field:
      type: link
      display: 'Main link'
      instructions: 'Link below the title. If empty, a link to the portfolio is generated.'
      localizable: true
      collections:
        - pages
        - projects
        - posts
  -
    handle: main_link_title
    field:
      type: text
      display: 'Main link label'
      instructions: 'Optional label for the main link. If empty, "Projekt anfragen" (translated) is used.'
      localizable: true
  -
    handle: projects
    field:
      type: entries
      collections:
        - projects
      max_items: 7
      display: Projects
      instructions: 'The projects shown in the grid, in this order. Seven fill the pattern exactly, because the title sits where the first one would. Fewer is fine — the empty rows close up.'
      localizable: false
      validate:
        - required
  -
    import: cta_section_header
  -
    import: cta_text
  -
    import: cta
