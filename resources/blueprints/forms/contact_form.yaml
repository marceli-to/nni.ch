tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              input_type: text
              antlers: false
              type: text
              display: Name
              icon: text
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
              validate:
                - required
              localizable: false
          -
            handle: email
            field:
              input_type: email
              antlers: false
              type: text
              display: E-Mail
              icon: text
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
              validate:
                - required
                - email
              localizable: false
          -
            handle: phone
            field:
              input_type: tel
              antlers: false
              type: text
              display: Phone
              icon: text
              localizable: false
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
          -
            handle: message
            field:
              antlers: false
              type: textarea
              display: Nachricht
              icon: textarea
              listable: hidden
              instructions_position: above
              visibility: visible
              replicator_preview: true
              hide_display: false
              localizable: false
  origin:
    display: Herkunft
    sections:
      -
        fields:
          -
            handle: origin_landing
            field:
              type: text
              antlers: false
              display: 'Einstiegsseite (ab Analyse-Einwilligung)'
              validate:
                - nullable
                - string
                - 'max:500'
          -
            handle: origin_referrer
            field:
              type: text
              antlers: false
              display: 'Verweisende Website (Domain)'
              validate:
                - nullable
                - string
                - 'max:253'
          -
            handle: origin_campaign
            field:
              type: text
              antlers: false
              display: 'Kampagne (erste UTM-Kennung im Besuch)'
              validate:
                - nullable
                - string
                - 'max:6000'
          -
            handle: origin_path
            field:
              type: textarea
              antlers: false
              display: 'Weg zur Anfrage (letzte 20 Seiten ab Analyse-Einwilligung)'
              validate:
                - nullable
                - string
                - 'max:12000'
