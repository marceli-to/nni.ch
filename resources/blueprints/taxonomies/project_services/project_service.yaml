title: 'Project service'
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              localizable: true
              instructions: 'Service name as shown in the project''s service list.'
              validate:
                - required
          -
            handle: slug
            field:
              type: slug
              required: true
              localizable: false
              from: title
              generate: true
              validate:
                - required
                - 'max:200'
          -
            handle: page
            field:
              type: entries
              display: 'Service page'
              instructions: 'Optional. Projects link this service to the page, in the visitor''s language. Leave empty to show the service without a link.'
              collections:
                - pages
              max_items: 1
              mode: select
              create: false
              localizable: false
