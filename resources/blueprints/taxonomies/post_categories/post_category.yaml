tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              localizable: true
          -
            handle: slug
            field:
              type: slug
              required: true
              validate:
                - required
                - 'max:200'
              localizable: true
              instructions_position: above
              listable: hidden
              visibility: visible
              replicator_preview: true
              from: title
              generate: true
              show_regenerate: true
              hide_display: false
  seo:
    display: SEO
    sections:
      -
        fields:
          -
            handle: open_graph_title
            field: seo.open_graph_title
          -
            handle: open_graph_description
            field: seo.open_graph_description
title: Category
