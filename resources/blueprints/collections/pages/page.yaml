title: Page
tabs:
  main:
    display: Content
    sections:
      -
        display: Content
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: Titel
              localizable: true
          -
            handle: portfolio_title
            field: title.title
            config:
              instructions: 'Add a styleable title. It is shown top left in the portfolio grid; leave it empty to fall back to the page title.'
              if:
                template: 'equals project/index'
          -
            handle: team_title
            field: title.title
            config:
              instructions: 'Add a styleable title above the team listing; leave it empty to fall back to the page title.'
              if:
                template: 'equals team/index'
          -
            handle: page_elements
            field:
              collapse: true
              type: replicator
              display: Inhalte
              localizable: true
              sets:
                main_elements:
                  display: 'Main Elements'
                  icon: layout-grid
                  sets:
                    intro:
                      display: 'Intro Fullscreen'
                      instructions: 'Add an intro (Video/Image)'
                      icon: hero-image-screen-panoramic
                      fields:
                        -
                          import: intro
                    teaser_video:
                      display: 'Fullscreen Video'
                      instructions: 'Add a teaser with a video, text and call to action.'
                      icon: media-computer-screen-tv
                      fields:
                        -
                          import: teaser_video
                    video:
                      display: Video
                      instructions: 'Add a video with playback controls, a poster image and an optional caption.'
                      icon: movie-video-clip
                      fields:
                        -
                          import: page_video
                    virtual_tour:
                      display: 'Virtueller Rundgang'
                      instructions: 'Add a virtual tour that loads after clicking its poster image.'
                      icon: travel-map
                      fields:
                        -
                          import: page_virtual_tour
                    teaser_fullscreen_image:
                      display: 'Fullscreen Image'
                      instructions: 'Add a teaser with a fullscreen image, text and call to action.'
                      icon: orientation-image-picture-horizontal-landscape
                      fields:
                        -
                          import: teaser_image
                    teaser_image_text:
                      display: 'Image - Text'
                      instructions: 'Add a teaser with an image, a text and a call to action.'
                      icon: text-formatting-image-left
                      fields:
                        -
                          import: teaser_image_text
                    title_text:
                      display: 'Title - Text'
                      instructions: 'Add title/text element'
                      icon: text-formatting-paragraph
                      fields:
                        -
                          import: title_text
                    editor:
                      display: Texteditor
                      icon: text-formatting-markdown
                      fields:
                        -
                          import: editor
                special_elements:
                  display: 'Special Elements'
                  icon: favorite-star
                  sets:
                    statement:
                      display: Statement
                      instructions: 'Optional Heading with an offset text'
                      icon: quote
                      fields:
                        -
                          import: statement
                    cta_expertise:
                      display: 'CTA Consultation'
                      instructions: 'Consultation CTA (text left, portrait right).'
                      icon: cursor-click
                      fields:
                        -
                          import: cta_expertise
                    teaser_projects_grid:
                      display: 'Portfolio (Grid)'
                      instructions: 'A picked selection of projects in the portfolio grid, with a title and a CTA.'
                      icon: layout-masonry
                      fields:
                        -
                          import: teaser_projects_grid
                    teaser_competencies:
                      display: 'Teaser Competencies'
                      instructions: '3-column competencies teaser, with or without images.'
                      icon: layout-hero-three-columns
                      fields:
                        -
                          import: teaser_competencies
                    principles:
                      display: Principles
                      instructions: 'Add company principles'
                      icon: lightbulb-idea
                      fields:
                        -
                          import: principles
                    facts_figures:
                      display: 'Facts & Figures'
                      instructions: 'Key numbers with labels (e.g. 8000+ Visualised projects).'
                      icon: charts-donut-graph
                      fields:
                        -
                          import: facts_figures
                    teaser_blog:
                      display: 'Blog Teaser'
                      instructions: 'Add the latest 3 blog entries'
                      icon: media-news-paper
                      fields:
                        -
                          import: teaser_blog
                    slideshow_team:
                      display: 'Slideshow Team'
                      instructions: 'Add the team as a slideshow'
                      icon: team
                      fields:
                        -
                          import: slideshow_team
                    jobs:
                      display: Jobs
                      instructions: 'Add a list of published jobs'
                      icon: user-avatar
                      fields:
                        -
                          import: jobs
                    faq:
                      display: FAQ
                      instructions: 'Add an FAQ section'
                      icon: form-drop-down-menu
                      fields:
                        -
                          import: faq
                    workflow:
                      display: Workflow
                      instructions: 'Add a workflow with multiple phases'
                      icon: workflow
                      fields:
                        -
                          import: workflow
                    services:
                      display: Services
                      instructions: 'Add a list of services'
                      icon: layout-list
                      fields:
                        -
                          import: services
                    marquee:
                      display: 'Logo Marquee'
                      instructions: 'Insert the auto-scrolling, full-width logo strip, then add the logos directly on this element.'
                      icon: layout-carousel-horizontal
                      fields:
                        -
                          import: marquee
                    network:
                      display: Network
                      instructions: 'A titled row of network partners — logo, label and external link each.'
                      icon: hierarchy-hub-integration-connection
                      fields:
                        -
                          import: network
                graphical_elements:
                  display: 'Graphical Elements'
                  icon: hr
                  sets:
                    horizontal_ruler:
                      display: 'Horizontal Ruler'
                      instructions: 'Add a thin, gray line'
                      icon: hr
                      fields:
                        -
                          import: horizontal_ruler
  seo:
    display: SEO
    sections:
      -
        display: SEO
        fields:
          -
            import: seo
  settings:
    display: Settings
    sections:
      -
        display: Settings
        fields:
          -
            import: settings
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
              show_regenerate: true
